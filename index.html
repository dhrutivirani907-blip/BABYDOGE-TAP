<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>App Closed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* Full screen overlay */
    #closedPopup {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
    }

    /* Popup box */
    .popup {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .popup h2 {
      margin: 0 0 18px;
      font-size: 25px;
      color: #e53935;
      font-weight: 700;
    }

    .popup p {
      font-size: 16px;
      line-height: 1.6;
      color: #333;
      margin-bottom: 25px;
    }

    .reason {
      font-weight: bold;
      color: #111;
    }

    .bonk-button {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: #f5a623;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .bonk-button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <!-- Closed App Popup -->
  <div id="closedPopup">
    <div class="popup">

      <div class="icon">⚠️</div>

      <h2>🚫 This App Is Permanently Closed</h2>

      <p>
        <span class="reason">Reason:</span><br>
        We are unable to manage all of our apps, so we have decided to
        permanently close this app.
        <br><br>
        Our final app, <b>BONK Taping</b>, is now available.
        Please go to the BONK Taping App and continue earning. 🪙
      </p>

      <a
        class="bonk-button"
        href="https://t.me/PEPE_Faucet_Airdrop_bot"
        target="_blank"
      >
        🚀 Go to the BONK Taping App
      </a>

    </div>
  </div>

</body>
</html>
